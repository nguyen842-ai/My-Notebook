<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>My Notebook</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Notebook">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>

<style>
:root{
  --color-warm-parchment:#f2f0eb; --color-paper-white-rgb:255,255,255;
  --color-soft-mist:rgba(150,150,150,.3); --color-stone-gray:#666;
  --font-super:'Inter',system-ui,sans-serif; --editor-fs:16px;
  --user-text-color:#292827; --user-btn-color:#421d24; --hover-bg:rgba(150,150,150,.1);
}
html,body{overscroll-behavior-y:none;background-color:var(--color-warm-parchment)}
*{touch-action:manipulation}
html.dark-mode,body.dark-mode{--color-warm-parchment:#18181a;--color-paper-white-rgb:36,36,38;--color-stone-gray:#9e9e9e;background-color:#18181a}
body{font-family:var(--font-super);color:var(--user-text-color);margin:0;padding:0;line-height:1.6;height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;background-size:cover;background-position:center}
.bg-overlay{position:fixed;inset:0;background:var(--color-warm-parchment);z-index:-1;pointer-events:none;transition:opacity .3s;opacity:0}
body[data-has-bg="true"] .bg-overlay{opacity:.25}
body.dark-mode[data-has-bg="true"] .bg-overlay{background:#121212}

.glass-panel{background-color:rgba(var(--color-paper-white-rgb),.55);border:1px solid var(--color-soft-mist)}
.blur{background-color:rgba(var(--color-paper-white-rgb),.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

#startup-loader{position:fixed;inset:0;background:var(--color-warm-parchment);z-index:100000;display:flex;justify-content:center;align-items:center;transition:opacity .4s}
.loader-container{position:relative;width:160px;height:100px}
.loader{position:absolute;top:50%;left:50%;z-index:10;width:160px;height:100px;margin:-50px 0 0 -80px;border-radius:5px;background:#1e3f57;animation:dot1_ 3s cubic-bezier(.55,.3,.24,.99) infinite}
.loader:nth-child(2){z-index:11;width:150px;height:90px;margin:-45px 0 0 -75px;border-radius:3px;background:#3c517d;animation-name:dot2_}
.loader:nth-child(3){z-index:12;width:40px;height:20px;margin:50px 0 0 -20px;border-radius:0 0 5px 5px;background:#6bb2cd;animation-name:dot3_}
@keyframes dot1_{3%,97%{width:160px;height:100px;margin-top:-50px;margin-left:-80px}30%,36%{width:80px;height:120px;margin-top:-60px;margin-left:-40px}63%,69%{width:40px;height:80px;margin-top:-40px;margin-left:-20px}}
@keyframes dot2_{3%,97%{height:90px;width:150px;margin-left:-75px;margin-top:-45px}30%,36%{width:70px;height:96px;margin-left:-35px;margin-top:-48px}63%,69%{width:32px;height:60px;margin-left:-16px;margin-top:-30px}}
@keyframes dot3_{3%,97%{height:20px;width:40px;margin-left:-20px;margin-top:50px}30%,36%{width:8px;height:8px;margin-left:-5px;margin-top:49px;border-radius:8px}63%,69%{width:16px;height:4px;margin-left:-8px;margin-top:-37px;border-radius:10px}}

.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;border-radius:8px;outline:none;border:none!important;font-family:var(--font-super);font-size:14px;font-weight:500;cursor:pointer;transition:.2s;background-color:var(--user-btn-color)!important;color:var(--user-text-color)!important}
.btn:hover{filter:brightness(1.15);box-shadow:0 4px 12px rgba(0,0,0,.1);transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn-full{width:100%;margin-top:8px}
.icon-btn{background:transparent;border:none;cursor:pointer;color:var(--user-text-color);font-size:16px;opacity:.6;transition:.2s;padding:4px}
.icon-btn:hover{opacity:1;transform:scale(1.1)}

#auth-screen{position:absolute;inset:0;z-index:9999;display:none;flex-direction:column;justify-content:center;align-items:center}
.auth-container{width:100%;max-width:400px;padding:48px 40px;display:flex;flex-direction:column;align-items:center;border-radius:16px;box-shadow:0 12px 48px rgba(0,0,0,.05);box-sizing:border-box}
.auth-container h1{font-weight:500;font-size:28px;margin:0 0 32px;text-align:center}
.input{width:100%;height:48px;margin-bottom:16px;border-radius:8px;border:1px solid var(--color-soft-mist);background-color:rgba(var(--color-paper-white-rgb),.5);font-size:16px;color:var(--user-text-color);padding:0 16px;outline:none;font-family:var(--font-super);box-sizing:border-box;transition:.2s}
.input:focus,.setting-input:focus{border-color:var(--user-btn-color);box-shadow:0 0 0 2px rgba(0,0,0,.1)}
.auth-switch,.auth-forgot{font-size:14px;color:var(--user-text-color);cursor:pointer;background:none;border:none;margin-bottom:8px;font-weight:500}
.auth-switch:hover,.auth-forgot:hover{text-decoration:underline}
.auth-msg{margin-top:16px;font-size:14px;display:none}
.auth-msg.error{color:#d9534f}

#main-app{display:none;width:100%;height:100vh;height:100dvh;position:relative}
.main-content{height:100%;overflow-y:auto;display:flex;flex-direction:column;padding:0 40px;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
main{animation:fadeIn .3s cubic-bezier(.2,.8,.2,1) forwards}
body.editor-open .main-content{overflow:hidden}
.container{width:100%;max-width:1000px;margin:64px auto;display:flex;flex-direction:column;flex-grow:1;min-height:0}
.diary-title{font-size:48px;font-weight:500;margin:0 0 48px;letter-spacing:-1px;flex-shrink:0}

#openMenuBtn{position:fixed;top:24px;right:24px;z-index:900;border-radius:50%;width:48px;height:48px;font-size:20px;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.1)}

.sidebar{width:340px;height:100vh;height:100dvh;overflow-y:auto;position:fixed;right:0;top:0;transform:translateX(105%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:1000;display:flex;flex-direction:column;will-change:transform;background-color:rgba(var(--color-paper-white-rgb),.8)}
.sidebar.open{transform:none}
.sidebar-header{padding:24px;font-weight:500;font-size:19px;border-bottom:1px solid var(--color-soft-mist);display:flex;justify-content:space-between;align-items:center}
.sidebar-box{padding:24px;border-bottom:1px solid var(--color-soft-mist)}
.setting-input{padding:10px 12px;font-family:var(--font-super);font-size:14px;width:100%;box-sizing:border-box;border:1px solid var(--color-soft-mist);background:rgba(var(--color-paper-white-rgb),.5);color:var(--user-text-color);border-radius:8px;margin-top:8px;outline:none}
.setting-item{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:12px}
.history-grid-container{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:5px}
.history-img-box{width:40px;height:40px;flex-shrink:0;border-radius:8px;border:1px solid var(--color-soft-mist);background-size:cover;background-position:center;cursor:pointer;transition:transform .2s}
.history-img-box:hover{transform:scale(1.1)}
.menu-accordion{border:1px solid var(--color-soft-mist);border-radius:8px;overflow:hidden;margin-top:16px;font-size:14px}
.menu-accordion summary{padding:12px 16px;font-weight:500;cursor:pointer;outline:none;list-style:none;display:flex;align-items:center;justify-content:space-between}
.menu-accordion summary::-webkit-details-marker{display:none}
.accordion-content{padding:16px;background:rgba(0,0,0,.03);border-top:1px solid var(--color-soft-mist)}
.list-item-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:8px 12px;border:1px solid var(--color-soft-mist);font-size:14px;border-radius:8px}
.list-item-row span{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.history-list{list-style:none;padding:0;margin:0}
.history-item a{text-decoration:none;color:var(--user-text-color);display:block;padding:8px 12px;border-radius:8px;transition:.2s}
.history-item a:hover{background-color:var(--hover-bg)}
.history-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-date{font-size:12px;color:var(--color-stone-gray)}

.tabs-container{display:flex;gap:8px;margin-bottom:48px;padding:8px;border-radius:8px;width:fit-content;flex-wrap:wrap}
.tabs-container .btn{padding:8px 24px;border-radius:6px;opacity:.7}
.tabs-container .btn.active-tab{opacity:1;box-shadow:inset 0 0 0 2px var(--user-text-color)}
.folder-grid{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:48px}
.folder-box{position:relative;overflow:hidden;width:calc(25% - 24px);min-width:160px;min-height:140px;border-radius:16px;border:1px solid var(--color-soft-mist);cursor:pointer;transition:.2s;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;background-size:cover;background-position:center;background-color:var(--user-btn-color)}
.folder-box:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(0,0,0,.1)}
.folder-box::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8),transparent 80%);pointer-events:none}
.folder-name{position:relative;z-index:2;font-size:18px;font-weight:600;color:#fff;line-height:1.3;text-shadow:1px 1px 4px rgba(0,0,0,.9)}
.entry-table{width:100%;border-collapse:collapse;border-radius:16px;overflow:hidden}
.entry-table th{text-align:left;padding:16px 24px;border-bottom:1px solid var(--color-soft-mist);font-size:13px;color:var(--color-stone-gray);font-weight:500}
.entry-table td{padding:16px 24px;border-bottom:1px solid var(--color-soft-mist);font-size:15px}
.entry-table tr:last-child td{border-bottom:none}
.entry-table tr:hover td{background:var(--hover-bg);cursor:pointer}
.back-btn{font-size:14px;font-weight:500;color:var(--user-text-color);cursor:pointer;background:none;border:none;padding:0;margin-bottom:32px;display:inline-flex;gap:8px;opacity:.8;align-self:flex-start}
.back-btn:hover{text-decoration:underline;opacity:1}

.editor-section{border-radius:16px;padding:32px 40px;margin-bottom:24px;display:flex;flex-direction:column;flex-grow:1;min-height:0}
.editor-header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px;border-bottom:1px solid var(--color-soft-mist);padding-bottom:16px}
.input-title{flex-grow:1;border:none;font-size:36px;font-weight:600;background:transparent;color:var(--user-text-color);outline:none;font-family:var(--font-super);min-width:0}
.input-title::placeholder{color:var(--color-stone-gray);opacity:.5}
.input-title[readonly]{pointer-events:none}
.editor-container,.editor-main-area{display:flex;flex-direction:column;flex-grow:1;min-height:0}
.toolbar-horizontal{display:flex;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--color-soft-mist);margin-bottom:16px;flex-shrink:0;overflow-x:auto;white-space:nowrap}
.toolbar-horizontal::-webkit-scrollbar{display:none}
.toolbar-horizontal .btn{padding:6px 12px;font-size:13px;flex-shrink:0}
.editor-box{flex-grow:1;overflow-y:auto;outline:none;font-size:var(--editor-fs)!important;line-height:1.8;padding-right:8px}
.editor-box[placeholder]:empty:before{content:attr(placeholder);color:var(--color-stone-gray);opacity:.7;pointer-events:none;display:block}
.editor-box::-webkit-scrollbar{width:6px}
.editor-box::-webkit-scrollbar-thumb{background-color:var(--color-soft-mist);border-radius:10px}
#editorBottomBar{display:none;flex-wrap:wrap;gap:16px;margin-top:16px;align-items:center;border-top:1px solid var(--color-soft-mist);padding-top:24px;justify-content:space-between;flex-shrink:0}
.word-count-display{font-size:13px;color:var(--color-stone-gray)}
.folder-select{padding:8px 12px;font-family:var(--font-super);font-size:14px;background:rgba(var(--color-paper-white-rgb),.5);color:var(--user-text-color);border:1px solid var(--color-soft-mist);border-radius:8px;outline:none;cursor:pointer}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:3000;display:none;justify-content:center;align-items:center}
.modal-content{width:100%;max-width:600px;padding:40px;max-height:80vh;overflow-y:auto;border-radius:16px;box-shadow:0 12px 48px rgba(0,0,0,.2);box-sizing:border-box;background-color:rgba(var(--color-paper-white-rgb),.92)}
.modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--color-soft-mist);padding-bottom:24px;margin-bottom:24px}
.modal-header h2{margin:0;font-size:24px;font-weight:500}
.trash-item{border:1px solid var(--color-soft-mist);border-radius:12px;padding:24px;margin-bottom:16px}
.trash-title{font-size:18px;font-weight:500;margin-bottom:8px}

#toast{visibility:hidden;background-color:var(--user-text-color);color:rgb(var(--color-paper-white-rgb));text-align:center;padding:12px 24px;position:fixed;z-index:4000;bottom:32px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:500;border-radius:999px;opacity:0;transition:opacity .3s}
#toast.show{visibility:visible;opacity:1}

#cropModal{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:99999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.crop-header{color:#fff;margin-bottom:20px;font-size:18px;font-weight:500;text-align:center}
.crop-container{width:100%;max-width:600px;height:60vh;background:#222;border-radius:8px;overflow:hidden;touch-action:none}
.crop-actions{margin-top:24px;display:flex;gap:16px;width:100%;max-width:600px}
.crop-img{max-width:100%;display:block}

/* ---------- CSS Kéo thả (Drag & Drop) Native ---------- */
.btn[data-type="tab"], tr[data-type="entry"], .folder-box {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  cursor: grab;
}
.btn[data-type="tab"]:active, tr[data-type="entry"]:active {
  cursor: grabbing;
}
.drag-over.folder-box { transform:scale(1.02); box-shadow:0 0 0 3px #fff, 0 12px 24px rgba(0,0,0,.3); filter:brightness(1.15) }
.drag-over.btn[data-type="tab"] { opacity: 1; transform: translateY(-2px); box-shadow:inset 0 0 0 2px var(--user-text-color), 0 4px 12px rgba(0,0,0,.1) }

/* --- CSS CHẾ ĐỘ CHỈNH SỬA (JIGGLE MODE) --- */
@keyframes jiggle {
  0% { transform: rotate(-1.5deg) scale(1.02); }
  50% { transform: rotate(1.5deg) scale(1.02); }
  100% { transform: rotate(-1.5deg) scale(1.02); }
}
.folder-grid.is-editing .folder-box {
  animation: jiggle 0.35s infinite ease-in-out;
  cursor: grab !important;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  
  /* [QUAN TRỌNG CHO IOS]: Vô hiệu hoá kéo thả mặc định của trình duyệt để Thư viện Polyfill làm việc */
  -webkit-user-drag: none; 
  touch-action: none; 
}

/* Tắt chuyển động lúc ngón tay chạm vào để iOS không bị loạn Hit-Test */
.folder-grid.is-editing .folder-box:active,
.folder-grid.is-editing .folder-box:hover {
  cursor: grabbing !important;
  animation: none; 
  transform: scale(1.05);
}

body:not(.editor-open) .container{flex-shrink:0;min-height:min-content}
@media (max-width:768px){
  .container{margin-bottom:0; padding-bottom: 150px !important;}
  .main-content{padding:calc(max(env(safe-area-inset-top),24px) + 16px) max(env(safe-area-inset-right),16px) calc(max(env(safe-area-inset-bottom),24px) + 80px) max(env(safe-area-inset-left),16px)}
  #openMenuBtn{top:calc(max(env(safe-area-inset-top),24px) + 16px);right:16px;width:44px;height:44px}
  .diary-title{font-size:32px;margin:0 0 24px;min-height:44px;display:flex;align-items:center;padding-right:56px}
  .editor-section{padding:24px 20px}
  .input-title{font-size:28px;padding-right:56px}
  .folder-grid{gap:16px;margin-bottom:32px}
  .folder-box{width:calc(50% - 8px);min-width:unset;min-height:120px;padding:16px;box-sizing:border-box;background-position:top center}
  .folder-name{font-size:16px}
  .crop-container{height:50vh}
}
</style>
<script>try { if(localStorage.getItem('savedDarkMode')==='true')document.documentElement.classList.add('dark-mode'); } catch(e){}</script>
<!-- [QUAN TRỌNG]: Bỏ chữ 'defer' để thư viện load ngay lập tức, chặn đứng sự can thiệp của iOS -->
<script src="https://unpkg.com/drag-drop-touch@1.0.2/DragDropTouch.js"></script>
</head>
<body>

<div class="bg-overlay"></div>

<div id="startup-loader"><div class="loader-container"><div class="loader"></div><div class="loader"></div><div class="loader"></div></div></div>

<div id="cropModal">
  <div class="crop-header">Di chuyển &amp; Phóng to ảnh để cắt</div>
  <div class="crop-container"><img id="imageToCrop" class="crop-img" alt=""></div>
  <div class="crop-actions">
    <button class="btn btn-full" style="background-color:#555!important;color:#fff!important;margin-top:0" data-act="crop-close">Hủy bỏ</button>
    <button class="btn btn-full" style="background-color:#28a745!important;color:#fff!important;margin-top:0" data-act="crop-apply">Cắt &amp; Áp dụng</button>
  </div>
</div>

<div id="auth-screen">
  <div class="auth-container glass-panel blur">
    <h1 class="app-title-display">My Notebook</h1>
    <input type="email" id="auth-email" class="input" placeholder="Email của bạn" autocomplete="email">
    <input type="password" id="auth-password" class="input" placeholder="Mật khẩu" autocomplete="current-password">
    <button class="btn btn-full" id="btn-login" data-act="auth">Đăng Nhập</button>
    <button class="auth-switch" data-act="auth-toggle">Chưa có tài khoản? Đăng ký ngay</button>
    <button class="auth-forgot" data-act="auth-forgot">Quên mật khẩu?</button>
    <div id="auth-message" class="auth-msg"></div>
  </div>
</div>

<div id="main-app">
  <button class="btn glass-panel" id="openMenuBtn" aria-label="Mở menu">☰</button>

  <div class="sidebar glass-panel blur" id="sidebar">
    <div class="sidebar-header">Công cụ <button id="closeMenuBtn" class="icon-btn" aria-label="Đóng">&times;</button></div>
    <div class="sidebar-box">
      <button class="btn btn-full" data-act="new-entry" style="padding:12px;margin:0 0 24px">✍️ Viết bài mới</button>

      <details class="menu-accordion">
        <summary>🎨 Cài đặt Giao diện <span>▾</span></summary>
        <div class="accordion-content">
          <div class="setting-item" style="flex-direction:column;align-items:flex-start;gap:4px">
            <label for="settingAppTitle">Tiêu đề Ứng dụng:</label>
            <input type="text" id="settingAppTitle" class="setting-input" placeholder="Ví dụ: Nhật ký của tôi" style="margin:0">
          </div>
          <div class="setting-item" style="margin-top:12px"><label>Màu chữ chung:</label><input type="color" id="settingTextColor" style="cursor:pointer;width:30px;height:30px;border:none;background:transparent;padding:0"></div>
          <div class="setting-item"><label>Màu nền các Nút bấm:</label><input type="color" id="settingBtnColor" style="cursor:pointer;width:30px;height:30px;border:none;background:transparent;padding:0"></div>
          <div class="setting-item"><label>Chế độ Tối (Dark Mode)</label><input type="checkbox" id="darkModeToggle"></div>
          <div class="setting-item" style="flex-direction:column;align-items:flex-start;gap:8px"><label>Cỡ chữ soạn thảo</label><input type="range" id="fontSizeSlider" min="14" max="32" value="16" style="width:100%"></div>
          <div style="margin-top:16px">
            <label style="font-size:14px;display:block">Link ảnh nền (URL):</label>
            <input type="text" id="settingBgUrl" class="setting-input" placeholder="Nhập link ảnh..." style="margin:0">
            <input type="file" id="localBgUploader" accept="image/*" style="display:none">
            <button class="btn btn-full" data-act="pick-bg" style="background-color:var(--color-stone-gray)!important">Tải ảnh từ máy (Cắt thủ công)</button>
            <div class="history-grid-container" id="imageHistoryGrid"></div>
            <button class="btn btn-full" data-act="save-visual" style="margin-top:12px">Lưu Cài Đặt</button>
          </div>
        </div>
      </details>

      <details class="menu-accordion">
        <summary>📁 Quản lý Tabs <span>▾</span></summary>
        <div class="accordion-content">
          <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
            <input type="text" id="newTabName" class="setting-input" placeholder="Tên Tab mới..." style="margin:0">
            <button class="btn btn-full" data-act="new-tab" style="margin:0">Tạo Tab</button>
          </div>
          <div id="tabSettingsList"></div>
        </div>
      </details>

      <details class="menu-accordion">
        <summary>📂 Quản lý Thư mục <span>▾</span></summary>
        <div class="accordion-content">
          <details class="menu-accordion" style="margin-top:0">
            <summary>➕ Tạo thư mục mới <span>▾</span></summary>

<script type="module">
window.addEventListener("error", function(e) {
  const loader = document.getElementById('startup-loader');
  if(loader) loader.style.display = 'none';
  console.error("Lỗi JS: ", e.message);
});
setTimeout(() => {
  const loader = document.getElementById('startup-loader');
  if (loader && loader.style.opacity !== '0') {
    loader.style.opacity = '0';
    setTimeout(() => loader.remove(), 450);
    if (document.getElementById('auth-screen').style.display !== 'none') {
        document.getElementById('auth-screen').style.display = 'flex';
    }
  }
}, 5000);

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, getDoc, setDoc, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBGmLt1ka6mEVFcAlKU0-q6or66jTsuep4",
  authDomain: "uyen-fdf7d.firebaseapp.com",
  projectId: "uyen-fdf7d",
  storageBucket: "uyen-fdf7d.firebasestorage.app",
  messagingSenderId: "539808857702",
  appId: "1:539808857702:web:bf074ecdde987bfcdc37a7"
});
const auth = getAuth(app);
const isFile = location.protocol === 'file:';
const dbOpts = { experimentalAutoDetectLongPolling: true }; 
if (!isFile) dbOpts.localCache = persistentLocalCache({ tabManager: persistentMultipleTabManager() });

let db;
try { db = initializeFirestore(app, dbOpts); } catch (e) { 
  try { db = getFirestore(app); } catch(err) { db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true }); }
}

if (isFile) console.warn("Đang mở bằng file://.");

const diaryCol = collection(db, "diaries");
const tabsCol = collection(db, "notebook_tabs");
const foldersCol = collection(db, "notebook_folders");

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^(https?:|data:image\/)/i.test(u || '') ? u : '';
const cleanHtml = h => window.DOMPurify ? DOMPurify.sanitize(h || '') : esc(h || '');
const dateFmt = new Intl.DateTimeFormat('vi-VN', { year:'numeric', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
const formatDate = s => { const d = s && new Date(s); return d && !isNaN(d) ? dateFmt.format(d) : ""; };
const countText = t => { t = t.trim(); return t ? t.split(/\s+/).length : 0; };

let toastTimer;
function showToast(m) { 
  const t = $('toast'); t.textContent = m; t.className = 'show'; 
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 3000); 
}
const guard = (fn, msg = "Có lỗi xảy ra!") => async (...a) => { try { return await fn(...a); } catch (e) { console.error(e); showToast(msg); } };

const idb = {
  open: () => new Promise((res, rej) => { const r = indexedDB.open('notebook', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
  async tx(mode, fn) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction('kv', mode); const q = fn(t.objectStore('kv')); t.oncomplete = () => res(q.result); t.onerror = () => rej(t.error); }); },
  get(k) { return this.tx('readonly', s => s.get(k)); },
  set(k, v) { return this.tx('readwrite', s => s.put(v, k)); },
  del(k) { return this.tx('readwrite', s => s.delete(k)); }
};

let currentUser = null, isLoginMode = true;
let settings = { bgUrl: "", isDark: false, fontSize: "16", recentImages: [], appTitle: "My Notebook", textColor: "#292827", btnColor: "#421d24" };
let allTabs = [], allFolders = [], entriesCache = [];
let currentTabId = null, currentFolderViewId = null, currentEditingId = null, bgObjectUrl = null;
const editor = $('diaryEditor');
const loaderStart = Date.now(), LOADER_MIN = 700;

const btnLogin = $('btn-login');
const authMsg = $('auth-message');

const resetLoginBtn = () => { btnLogin.disabled = false; btnLogin.textContent = isLoginMode ? "Đăng Nhập" : "Tạo Tài Khoản Mới"; };
function showAuthMsg(m, type) { authMsg.textContent = m; authMsg.className = "auth-msg " + type; authMsg.style.display = "block"; }

async function handleAuth() {
  const email = $('auth-email').value.trim(), pw = $('auth-password').value.trim();
  if (!email || !pw) return showAuthMsg("Vui lòng nhập Email và Mật khẩu!", "error");
  btnLogin.disabled = true; btnLogin.textContent = "Đang xử lý...";
  try { await (isLoginMode ? signInWithEmailAndPassword : createUserWithEmailAndPassword)(auth, email, pw); } 
  catch (e) { 
    console.error("Lỗi Auth: ", e);
    showAuthMsg({ 
      'auth/email-already-in-use': "Email đã dùng!", 
      'auth/invalid-credential': "Sai email/mật khẩu!", 
      'auth/weak-password': "Mật khẩu >= 6 ký tự!",
      'auth/operation-not-allowed': "Tài khoản Email/Password chưa bật trong Firebase!"
    }[e.code] || ("Lỗi: " + e.message), "error"); 
  } 
  finally { resetLoginBtn(); }
}
async function handleForgot() {
  const email = $('auth-email').value.trim(); if (!email) return showAuthMsg("Vui lòng nhập Email!", "error");
  try { await sendPasswordResetEmail(auth, email); showAuthMsg("Đã gửi email khôi phục!", "success"); } catch { showAuthMsg("Lỗi: Không tìm thấy tài khoản.", "error"); }
}
function toggleAuth() {
  isLoginMode = !isLoginMode; resetLoginBtn();
  document.querySelector('.auth-switch').textContent = isLoginMode ? "Chưa có tài khoản? Đăng ký ngay" : "Đã có tài khoản? Đăng nhập";
  authMsg.style.display = "none";
}

onAuthStateChanged(auth, async user => {
  currentUser = user;
  if (user) { $('auth-screen').style.display = 'none'; $('main-app').style.display = 'block'; await guard(loadCoreData)(); } 
  else { resetLoginBtn(); $('auth-screen').style.display = 'flex'; $('main-app').style.display = 'none'; }
  const loader = $('startup-loader');
  if (loader) { setTimeout(() => { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 450); }, Math.max(0, LOADER_MIN - (Date.now() - loaderStart))); }
});

function setDark(on) { 
  document.body.classList.toggle('dark-mode', on); 
  document.documentElement.classList.toggle('dark-mode', on); 
  try { localStorage.setItem('savedDarkMode', on); } catch(e){} 
}
function setTitle(t) { const v = t.trim() || "My Notebook"; document.title = v; document.querySelectorAll('.app-title-display').forEach(el => el.textContent = v); }
function setBg(url) { document.body.style.backgroundImage = url ? `url("${url}")` : "none"; document.body.dataset.hasBg = url ? "true" : "false"; }
async function applyBackground() {
  let blob = null; try { blob = await idb.get('bg'); } catch {}
  if (blob) { if (bgObjectUrl) URL.revokeObjectURL(bgObjectUrl); bgObjectUrl = URL.createObjectURL(blob); setBg(bgObjectUrl); } else { setBg(safeUrl(settings.bgUrl)); }
}
function renderImageHistory() { $('imageHistoryGrid').innerHTML = (settings.recentImages || []).filter(safeUrl).map(u => `<div class="history-img-box" style="background-image:url('${esc(encodeURI(u))}')" data-act="pick-history" data-url="${esc(u)}" title="${esc(u)}"></div>`).join(''); }
function applySettingsToUI() {
  $('settingBgUrl').value = settings.bgUrl || ""; $('darkModeToggle').checked = settings.isDark; setDark(settings.isDark);
  document.documentElement.style.setProperty('--editor-fs', (settings.fontSize || "16") + 'px'); $('fontSizeSlider').value = settings.fontSize || "16";
  const t = settings.appTitle || "My Notebook"; $('settingAppTitle').value = t === "My Notebook" ? "" : t; setTitle(t);
  $('settingTextColor').value = settings.textColor; $('settingBtnColor').value = settings.btnColor;
  document.documentElement.style.setProperty('--user-text-color', settings.textColor); document.documentElement.style.setProperty('--user-btn-color', settings.btnColor);
  renderImageHistory(); applyBackground();
}
async function loadUserSettings() { try { const s = await getDoc(doc(db, "user_settings", currentUser.uid)); if (s.exists()) settings = { ...settings, ...s.data() }; } catch (e) {} applySettingsToUI(); }
const saveVisualSettings = guard(async () => {
  const bg = $('settingBgUrl').value.trim();
  if (bg) { settings.recentImages = [bg, ...(settings.recentImages || []).filter(u => u !== bg)].slice(0, 10); try { await idb.del('bg'); } catch {} }
  settings = { ...settings, bgUrl: bg, isDark: $('darkModeToggle').checked, fontSize: $('fontSizeSlider').value, appTitle: $('settingAppTitle').value.trim() || "My Notebook", textColor: $('settingTextColor').value, btnColor: $('settingBtnColor').value };
  applySettingsToUI(); await setDoc(doc(db, "user_settings", currentUser.uid), settings, { merge: true }); showToast("Đã lưu Cài đặt!");
});

const byCreated = (a, b) => (a.createdAt || '').localeCompare(b.createdAt || '');
const userQ = col => getDocs(query(col, where("userId", "==", currentUser.uid)));
async function loadCoreData() {
  if (!currentUser) return;
  const [, tabSnap, folderSnap, entrySnap] = await Promise.all([loadUserSettings(), userQ(tabsCol), userQ(foldersCol), userQ(diaryCol)]);
  allTabs = tabSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || byCreated(a, b));
  allFolders = folderSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || byCreated(a, b));
  entriesCache = entrySnap.docs.map(d => ({ id: d.id, ...d.data() }));
  if (!allTabs.length) { const r = await addDoc(tabsCol, { userId: currentUser.uid, name: "Chung", createdAt: new Date().toISOString(), order: 0 }); allTabs.push({ id: r.id, name: "Chung", createdAt: new Date().toISOString(), order: 0 }); }
  currentTabId = allTabs[0].id; renderAll();
}
function renderAll() { renderTabs(); renderFolderSelect(); renderSidebarSettings(); renderEntries(); }

function renderTabs() { $('tabsContainer').innerHTML = allTabs.map(t => `<button class="btn ${t.id === currentTabId ? 'active-tab' : ''}" draggable="true" data-type="tab" data-id="${esc(t.id)}" data-act="switch-tab">${esc(t.name)}</button>`).join(''); }
function renderFolderSelect() {
  const sel = $('folderSelect'), cur = sel.value, fs = allFolders.filter(f => f.tabId === currentTabId).sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || byCreated(a, b));
  sel.innerHTML = '<option value="">-- Không xếp thư mục --</option>' + fs.map(f => `<option value="${esc(f.id)}">📁 ${esc(f.name)}</option>`).join('');
  if (fs.some(f => f.id === cur)) sel.value = cur;
}
function renderSidebarSettings() {
  $('tabSettingsList').innerHTML = allTabs.map(t => `<div class="list-item-row"><span>${esc(t.name)}</span><div><button class="icon-btn" data-act="edit-tab" data-id="${esc(t.id)}">✏️</button><button class="icon-btn" data-act="delete-tab" data-id="${esc(t.id)}">🗑️</button></div></div>`).join('');
  const fs = allFolders.filter(f => f.tabId === currentTabId).sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || byCreated(a, b));
  $('folderSettingsList').innerHTML = fs.length ? fs.map(f => `<div class="list-item-row"><span>${esc(f.name)}</span><div><button class="icon-btn" data-act="edit-folder" data-id="${esc(f.id)}">✏️</button><button class="icon-btn" data-act="delete-folder" data-id="${esc(f.id)}">🗑️</button></div></div>`).join('') : '<div style="font-size:13px;color:var(--color-stone-gray);font-style:italic">Chưa có thư mục</div>';
}

let sortMode = 'updated-desc';
try { sortMode = localStorage.getItem('sortMode') || 'updated-desc'; } catch(e){}
const sorters = { 'name': (a, b) => a.title.localeCompare(b.title, 'vi', { numeric: true, sensitivity: 'base' }), 'updated-desc': (a, b) => b.ts.localeCompare(a.ts), 'updated-asc': (a, b) => a.ts.localeCompare(b.ts) };
const sortEntries = l => [...l].sort(sorters[sortMode] || sorters['updated-desc']);
function buildTable(list) {
  if (!list.length) return ''; list = sortEntries(list);
  return `<table class="entry-table glass-panel"><thead><tr><th style="width:50%">Tiêu đề</th><th style="width:25%">Cập nhật</th><th style="width:15%">Độ dài</th><th style="width:10%;text-align:center">Hành động</th></tr></thead><tbody>` + list.map(e => `<tr data-act="open-entry" draggable="true" data-type="entry" data-id="${esc(e.id)}"><td style="font-weight:500">${esc(e.title)}</td><td>${esc(e.dateStr)}</td><td style="color:var(--color-stone-gray)">${e.wCount} từ</td><td style="text-align:center"><button class="icon-btn" data-act="trash" data-id="${esc(e.id)}" title="Xóa">🗑️</button></td></tr>`).join('') + `</tbody></table>`;
}

let viewEntries = []; 
function renderEntries() {
  const sorted = [...entriesCache].sort((a, b) => byCreated(b, a));
  const tabFolders = allFolders.filter(f => f.tabId === currentTabId).sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || byCreated(a, b));
  const folderIds = new Set(tabFolders.map(f => f.id)); const firstTab = allTabs[0]?.id; viewEntries = []; const loose = [];
  
  for (const d of sorted) {
    if (d.status === 'trash') continue;
    if ((d.tabId || firstTab) !== currentTabId) continue;
    const e = { id: d.id, title: d.title?.trim() || "Tài liệu không tên", ts: d.updatedAt || d.createdAt || '', dateStr: formatDate(d.updatedAt || d.createdAt), wCount: d.wordCount || 0, folderId: d.folderId };
    viewEntries.push(e); if (!d.folderId || !folderIds.has(d.folderId)) loose.push(e);
  }
  
  $('sidebarHistoryList').innerHTML = viewEntries.length ? viewEntries.map(e => `<li class="history-item"><a href="#" data-act="open-entry" data-id="${esc(e.id)}"><div class="history-title">${esc(e.title)}</div><div class="history-date">${esc(e.dateStr)}</div></a></li>`).join('') : '<li style="font-size:13px;color:var(--color-stone-gray)">Chưa có hoạt động</li>';
  
  // Vẽ các khối thư mục
  $('folderGrid').innerHTML = tabFolders.map(f => { 
    const img = safeUrl(f.image); 
    // Nếu đang chế độ chỉnh sửa, gắn luôn draggable vào HTML
    const dragAttr = isEditMode ? 'draggable="true"' : '';
    return `<div class="folder-box" data-type="folder" ${dragAttr} ${img ? `style="background-image:url('${esc(encodeURI(img))}')"` : ''} data-act="open-folder" data-id="${esc(f.id)}"><div class="folder-name">${esc(f.name)}</div></div>`; 
  }).join('');
  
  // Cập nhật lại UI Jiggle nếu đang bật (trường hợp thả thư mục xong máy vẽ lại)
  if (isEditMode) $('folderGrid').classList.add('is-editing');
  else $('folderGrid').classList.remove('is-editing');
  
  $('looseEntriesSection').style.display = loose.length ? 'block' : 'none'; $('looseEntriesTable').innerHTML = buildTable(loose);
  if (currentFolderViewId) openFolderView(currentFolderViewId);
}

const createTab = guard(async () => { const name = $('newTabName').value.trim(); if (!name) return showToast("Vui lòng nhập tên Tab!"); const r = await addDoc(tabsCol, { userId: currentUser.uid, name, createdAt: new Date().toISOString(), order: allTabs.length }); allTabs.push({ id: r.id, name, createdAt: new Date().toISOString(), order: allTabs.length }); $('newTabName').value = ""; renderAll(); showToast("Đã tạo Tab mới!"); });
const editTab = guard(async id => { const t = allTabs.find(x => x.id === id), n = prompt("Nhập tên mới:", t.name)?.trim(); if (!n) return; await updateDoc(doc(db, "notebook_tabs", id), { name: n }); t.name = n; renderAll(); });
const deleteTab = guard(async id => {
  if (allTabs.length <= 1) return alert("Không thể xóa Tab cuối cùng!"); if (!confirm("Xóa Tab này?")) return;
  const firstTab = allTabs[0].id, batch = writeBatch(db); const entries = entriesCache.filter(e => (e.tabId || firstTab) === id && e.status !== 'trash');
  entries.forEach(e => batch.update(doc(db, "diaries", e.id), { status: 'trash' })); allFolders.filter(f => f.tabId === id).forEach(f => batch.delete(doc(db, "notebook_folders", f.id))); batch.delete(doc(db, "notebook_tabs", id)); await batch.commit();
  entries.forEach(e => e.status = 'trash'); allFolders = allFolders.filter(f => f.tabId !== id); allTabs = allTabs.filter(t => t.id !== id); if (currentTabId === id) { currentTabId = allTabs[0].id; closeEditor(); closeFolderView(); } renderAll();
});

const createFolder = guard(async () => {
  const name = $('newFolderName').value.trim(), image =$('newFolderImage').value.trim(); if (!name) return showToast("Vui lòng nhập tên Thư mục!");
  const r = await addDoc(foldersCol, { userId: currentUser.uid, tabId: currentTabId, name, image, createdAt: new Date().toISOString(), order: allFolders.length }); allFolders.push({ id: r.id, tabId: currentTabId, name, image, createdAt: new Date().toISOString(), order: allFolders.length }); $('newFolderName').value = ""; $('newFolderImage').value = ""; renderAll(); $('folderSelect').value = r.id; showToast("Đã tạo Thư mục!");
});
const deleteFolder = guard(async id => { if (!confirm("Xóa thư mục?")) return; await deleteDoc(doc(db, "notebook_folders", id)); allFolders = allFolders.filter(f => f.id !== id); if (currentFolderViewId === id) closeFolderView(); renderAll(); });
const editFolder = guard(async id => {
  const f = allFolders.find(x => x.id === id); if (!f) return; const n = prompt("Tên mới:", f.name); if (n === null) return; const img = prompt("Link ảnh bìa:", f.image || ""); if (img === null) return; if (!n.trim()) return showToast("Không được để trống!");
  await updateDoc(doc(db, "notebook_folders", id), { name: n.trim(), image: img.trim() }); Object.assign(f, { name: n.trim(), image: img.trim() }); renderAll();
});

let switching = false;
function switchTab(id) { if (id === currentTabId || switching) return; switching = true; currentTabId = id; closeEditor(); closeFolderView(); renderAll(); switching = false; }
function openFolderView(id) {
  const f = allFolders.find(x => x.id === id); if (!f) return; currentFolderViewId = id;
  $('mainHeader').style.display = 'none';$('mainBlogView').style.display = 'none'; $('editorView').style.display = 'none';$('folderDetailView').style.display = 'flex'; $('folderDetailTitle').textContent = f.name; $('folderEntriesTable').innerHTML = buildTable(viewEntries.filter(e => e.folderId === id));
}
function closeFolderView() { currentFolderViewId = null; $('folderDetailView').style.display = 'none';$('editorView').style.display = 'none'; $('mainHeader').style.display = 'block';$('mainBlogView').style.display = 'flex'; }
function showEditor() { $('sidebar').classList.remove('open'); ['mainHeader', 'mainBlogView', 'folderDetailView'].forEach(i => $(i).style.display = 'none');$('editorView').style.display = 'flex'; document.body.classList.add('editor-open'); }
function setEditMode(on) { $('entryTitle').toggleAttribute('readonly', !on); editor.setAttribute('contenteditable', on);$('editorToolbar').style.display = on ? 'flex' : 'none'; $('editorBottomBar').style.display = on ? 'flex' : 'none'; $('enableEditBtn').style.display = on ? 'none' : 'inline-flex'; if (on) editor.focus(); }
function toLocalInput(iso) { const d = new Date(iso); if (isNaN(d)) return ''; d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }
function openEditor() { currentEditingId = null; $('entryTitle').value = ""; editor.innerHTML = ""; $('folderSelect').value = currentFolderViewId || ""; $('liveWordCount').textContent = "0 từ"; $('saveBtn').textContent = "Lưu tài liệu"; $('entryDate').value = toLocalInput(new Date().toISOString()); showEditor(); setEditMode(true); setTimeout(() =>$('entryTitle').focus(), 100); }
function closeEditor() { currentEditingId = null; $('editorView').style.display = 'none'; document.body.classList.remove('editor-open'); if (currentFolderViewId) openFolderView(currentFolderViewId); else { $('mainHeader').style.display = 'block';$('mainBlogView').style.display = 'flex'; } }
function editEntry(id) {
  const e = entriesCache.find(x => x.id === id); if (!e) return;
  $('entryTitle').value = e.title || ""; 
  editor.innerHTML = cleanHtml(e.content); 
  $('folderSelect').value = e.folderId || "";
  $('liveWordCount').textContent = countText(editor.textContent) + " từ"; 
  $('entryDate').value = toLocalInput(e.createdAt); 
  currentEditingId = id; 
  $('saveBtn').textContent = "Cập nhật tài liệu"; 
  showEditor(); 
  setEditMode(false);
}

let wcTimer; editor.addEventListener('input', () => { clearTimeout(wcTimer); wcTimer = setTimeout(() => $('liveWordCount').textContent = countText(editor.textContent) + " từ", 200); });
$('saveBtn').addEventListener('click', guard(async () => {
  const title = $('entryTitle').value.trim(), content = cleanHtml(editor.innerHTML.trim()); if (!editor.textContent.trim() && !editor.querySelector('img')) return showToast("Bạn chưa viết nội dung!");
  const data = { title, content, folderId: $('folderSelect').value, wordCount: countText(editor.textContent), updatedAt: new Date().toISOString(), createdAt:$('entryDate').value ? new Date($('entryDate').value).toISOString() : new Date().toISOString() };
  const btn = $('saveBtn'); btn.disabled = true; btn.textContent = "Đang lưu...";
  try { if (currentEditingId) { await updateDoc(doc(db, "diaries", currentEditingId), data); Object.assign(entriesCache.find(e => e.id === currentEditingId), data); showToast("Đã cập nhật!"); } else { const full = { userId: currentUser.uid, tabId: currentTabId, status: 'active', ...data }; const r = await addDoc(diaryCol, full); entriesCache.push({ id: r.id, ...full }); showToast("Đã lưu trang mới!"); } renderEntries(); closeEditor(); } finally { btn.disabled = false; btn.textContent = currentEditingId ? "Cập nhật tài liệu" : "Lưu tài liệu"; }
}));

let savedRange = null; ['keyup', 'mouseup', 'mouseleave'].forEach(ev => editor.addEventListener(ev, () => { const s = getSelection(); if (s.rangeCount) savedRange = s.getRangeAt(0); }));
$('textColorPicker').addEventListener('input', e => { editor.focus(); if (savedRange) { const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange); } document.execCommand('styleWithCSS', false, true); document.execCommand('foreColor', false, e.target.value); });
editor.addEventListener('paste', e => { e.preventDefault(); const text = (e.clipboardData || window.clipboardData).getData('text/plain'); if (!text && [...(e.clipboardData?.items || [])].some(i => i.type.startsWith('image'))) return showToast("Chỉ hỗ trợ dán chữ!"); document.execCommand('insertText', false, text); });

const setStatus = async (id, status) => { await updateDoc(doc(db, "diaries", id), { status }); const e = entriesCache.find(x => x.id === id); if (e) e.status = status; };
function renderTrash() { const items = entriesCache.filter(e => e.status === 'trash').sort((a, b) => byCreated(b, a)); $('trashListContainer').innerHTML = items.length ? items.map(e => `<div class="trash-item glass-panel"><div class="trash-title">${esc(e.title?.trim() || "Tài liệu không tên")}</div><div style="font-size:14px;color:var(--color-stone-gray);margin-bottom:16px">${esc(formatDate(e.createdAt))}</div><div style="display:flex;gap:12px"><button class="btn" data-act="restore" data-id="${esc(e.id)}">Khôi phục</button><button class="btn" data-act="hard-delete" data-id="${esc(e.id)}">Xóa vĩnh viễn</button></div></div>`).join('') : '<p style="color:var(--color-stone-gray);text-align:center">Thùng rác trống.</p>'; }
const moveToTrash = guard(async id => { if (!confirm("Chuyển bài viết này vào Thùng rác?")) return; await setStatus(id, 'trash'); if (currentEditingId === id) closeEditor(); renderEntries(); });
const restore = guard(async id => { await setStatus(id, 'active'); renderTrash(); renderEntries(); });
const hardDelete = guard(async id => { if (!confirm("CẢNH BÁO: Xóa vĩnh viễn?")) return; await deleteDoc(doc(db, "diaries", id)); entriesCache = entriesCache.filter(e => e.id !== id); renderTrash(); });

let cropper = null, cropperLoaded;
function loadCropper() { return cropperLoaded ??= new Promise((res, rej) => { const css = Object.assign(document.createElement('link'), { rel: 'stylesheet', href: 'https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css' }); const js = Object.assign(document.createElement('script'), { src: 'https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js', onload: res, onerror: () => { cropperLoaded = null; rej(); } }); document.head.append(css, js); }); }
$('localBgUploader').addEventListener('change', guard(async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return; await loadCropper();   
  const src = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  $('sidebar').classList.remove('open'); const img = $('imageToCrop'); img.src = src; $('cropModal').style.display = 'flex'; cropper?.destroy();
  cropper = new Cropper(img, { aspectRatio: innerWidth / innerHeight, viewMode: 1, dragMode: 'move', autoCropArea: 1, restore: false, guides: true, center: true, highlight: false, cropBoxMovable: false, cropBoxResizable: false, toggleDragModeOnDblclick: false, zoomable: true, zoomOnTouch: true });
}));
function closeCrop() { $('cropModal').style.display = 'none'; cropper?.destroy(); cropper = null; }
const applyCrop = guard(async () => {
  if (!cropper) return; const w = Math.min(innerWidth, 1280), h = Math.round(w * innerHeight / innerWidth);
  const blob = await new Promise(res => cropper.getCroppedCanvas({ width: w, height: h, imageSmoothingQuality: 'high' }).toBlob(res, 'image/jpeg', 0.75));
  await idb.set('bg', blob); $('settingBgUrl').value = ''; await applyBackground(); showToast("Đã áp dụng hình nền thành công!"); closeCrop();
});

// --- XỬ LÝ NHẤN GIỮ 0.5S (JIGGLE MODE) CHO MOBILE ---
let pressTimer = null;
let isEditMode = false;
let isScrolling = false;

document.addEventListener('touchstart', e => {
  const folder = e.target.closest('.folder-box');
  
  if (isEditMode && !folder && !e.target.closest('[data-type="tab"]')) {
    isEditMode = false;
    document.getElementById('folderGrid').classList.remove('is-editing');
    document.querySelectorAll('.folder-box').forEach(el => el.removeAttribute('draggable'));
    showToast("Đã lưu vị trí!");
    return;
  }
  
  if (folder && !isEditMode) {
    isScrolling = false;
    pressTimer = setTimeout(() => {
      if (isScrolling) return; // Không kích hoạt nếu đang vuốt màn hình
      isEditMode = true;
      document.getElementById('folderGrid').classList.add('is-editing');
      document.querySelectorAll('.folder-box').forEach(el => el.setAttribute('draggable', 'true'));
      showToast("Thành công! Hãy NHẤC TAY LÊN, rồi chạm lại để kéo thư mục đi.");
      if (navigator.vibrate) navigator.vibrate(50);
    }, 500);
  }
}, { passive: true });

document.addEventListener('touchmove', () => { isScrolling = true; clearTimeout(pressTimer); }, { passive: true });
document.addEventListener('touchend', () => clearTimeout(pressTimer));
document.addEventListener('touchcancel', () => clearTimeout(pressTimer));

/* ---------- XỬ LÝ KÉO THẢ NATIVE + POLYFILL ---------- */
let draggedItem = null;

document.addEventListener('dragstart', e => {
  const folder = e.target.closest('[data-type="folder"]');
  // Chặn rác kéo nếu chưa bật Edit Mode
  if (folder && !isEditMode) {
    e.preventDefault(); 
    return;
  }

  const tab = e.target.closest('[data-type="tab"]');
  if (tab) { draggedItem = { type: 'tab', id: tab.dataset.id, el: tab }; e.dataTransfer.effectAllowed = 'move'; }
  const entry = e.target.closest('[data-type="entry"]');
  if (entry) { draggedItem = { type: 'entry', id: entry.dataset.id, el: entry }; e.dataTransfer.effectAllowed = 'move'; }
  if (folder) { draggedItem = { type: 'folder', id: folder.dataset.id, el: folder }; e.dataTransfer.effectAllowed = 'move'; }
});

document.addEventListener('dragover', e => {
  if (!draggedItem) return;
  e.preventDefault(); 
  
  if (draggedItem.type === 'tab') {
    const dropTab = e.target.closest('[data-type="tab"]');
    if (dropTab && dropTab !== draggedItem.el) dropTab.classList.add('drag-over');
  }
  if (draggedItem.type === 'entry') {
    const folder = e.target.closest('.folder-box');
    if (folder) folder.classList.add('drag-over');
    const dropTab = e.target.closest('[data-type="tab"]');
    if (dropTab) dropTab.classList.add('drag-over');
  }
  if (draggedItem.type === 'folder') {
    const dropFolder = e.target.closest('[data-type="folder"]');
    if (dropFolder && dropFolder !== draggedItem.el) dropFolder.classList.add('drag-over');
  }
});

document.addEventListener('dragleave', e => {
  if (!draggedItem) return;
  const el = e.target.closest && e.target.closest('.drag-over');
  if (el) el.classList.remove('drag-over');
});

document.addEventListener('drop', async e => {
  if (!draggedItem) return;
  e.preventDefault();
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));

  const type = draggedItem.type;
  const itemId = draggedItem.id;

  if (type === 'tab') {
    const dropTab = e.target.closest('[data-type="tab"]');
    if (dropTab && dropTab.dataset.id !== itemId) {
      const draggedIdx = allTabs.findIndex(t => t.id === itemId);
      const dropIdx = allTabs.findIndex(t => t.id === dropTab.dataset.id);
      const [removed] = allTabs.splice(draggedIdx, 1);
      allTabs.splice(dropIdx, 0, removed);
      renderTabs(); 
      const batch = writeBatch(db);
      allTabs.forEach((t, i) => { t.order = i; batch.update(doc(db, "notebook_tabs", t.id), { order: i }); });
      await batch.commit();
    }
  }

  if (type === 'folder') {
    const dropFolder = e.target.closest('[data-type="folder"]');
    if (dropFolder && dropFolder.dataset.id !== itemId) {
      const draggedIdx = allFolders.findIndex(f => f.id === itemId);
      const dropIdx = allFolders.findIndex(f => f.id === dropFolder.dataset.id);
      const [removed] = allFolders.splice(draggedIdx, 1);
      allFolders.splice(dropIdx, 0, removed);
      renderEntries(); 
      const batch = writeBatch(db);
      allFolders.forEach((f, i) => { f.order = i; batch.update(doc(db, "notebook_folders", f.id), { order: i }); });
      await batch.commit();
    }
  }

  if (type === 'entry') {
    const folder = e.target.closest('.folder-box');
    const tab = e.target.closest('[data-type="tab"]');
    const entry = entriesCache.find(x => x.id === itemId);

    if (entry) {
      if (folder) {
        const fId = folder.dataset.id;
        if (entry.folderId !== fId) {
          entry.folderId = fId; renderEntries();
          try { await updateDoc(doc(db, "diaries", itemId), { folderId: fId }); showToast("Đã chuyển vào thư mục!"); } catch (err) {}
        }
      } else if (tab) {
        const tId = tab.dataset.id;
        if (entry.tabId !== tId || entry.folderId) {
          entry.tabId = tId; entry.folderId = null; renderEntries();
          try { await updateDoc(doc(db, "diaries", itemId), { tabId: tId, folderId: null }); showToast("Đã chuyển sang Tab mới!"); } catch (err) {}
        }
      }
    }
  }
  draggedItem = null;
});

document.addEventListener('dragend', () => {
  draggedItem = null;
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
});

const actions = {
  'auth': handleAuth, 'auth-toggle': toggleAuth, 'auth-forgot': handleForgot,
  'logout': () => { if (confirm("Bạn có chắc muốn đăng xuất?")) signOut(auth); },
  'new-entry': openEditor, 'close-editor': closeEditor, 'edit-mode': () => setEditMode(true),
  'switch-tab': t => switchTab(t.dataset.id), 'new-tab': createTab, 'edit-tab': t => editTab(t.dataset.id), 'delete-tab': t => deleteTab(t.dataset.id),
  'new-folder': createFolder, 'edit-folder': t => editFolder(t.dataset.id), 'delete-folder': t => deleteFolder(t.dataset.id),
  'open-folder': t => { if (!isEditMode) openFolderView(t.dataset.id); },
  'close-folder': closeFolderView,
  'open-entry': t => editEntry(t.dataset.id), 'trash': t => moveToTrash(t.dataset.id),
  'open-trash': () => { $('sidebar').classList.remove('open'); renderTrash();$('trashModal').style.display = 'flex'; },
  'close-trash': () => $('trashModal').style.display = 'none', 'restore': t => restore(t.dataset.id), 'hard-delete': t => hardDelete(t.dataset.id),
  'save-visual': saveVisualSettings, 'pick-bg': () => $('localBgUploader').click(),
  'pick-history': async t => { try { await idb.del('bg'); } catch {} $('settingBgUrl').value = t.dataset.url; setBg(safeUrl(t.dataset.url)); showToast("Đã chọn ảnh!"); },
  'crop-close': closeCrop, 'crop-apply': applyCrop
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t) { if (t.tagName === 'A') e.preventDefault(); if (t.dataset.act === 'trash') e.stopPropagation(); actions[t.dataset.act]?.(t); }
  const f = e.target.closest('[data-fmt]');
  if (f) { if (f.dataset.fmt === 'tab') document.execCommand('insertHTML', false, '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'); else document.execCommand(f.dataset.fmt, false, null); editor.focus(); }
  const sb = $('sidebar'); if (sb.classList.contains('open') && !sb.contains(e.target) && !$('openMenuBtn').contains(e.target)) { sb.classList.remove('open'); }
});

$('openMenuBtn').addEventListener('click', () =>$('sidebar').classList.add('open'));$('closeMenuBtn').addEventListener('click', () =>$('sidebar').classList.remove('open'));$('sortSelect').value = sortMode;
try { $('sortSelect').addEventListener('change', e => { sortMode = e.target.value; localStorage.setItem('sortMode', sortMode); renderEntries(); }); } catch(e){}$('settingAppTitle').addEventListener('input', e => setTitle(e.target.value));
$('settingTextColor').addEventListener('input', e => { document.documentElement.style.setProperty('--user-text-color', e.target.value); });$('settingBtnColor').addEventListener('input', e => { document.documentElement.style.setProperty('--user-btn-color', e.target.value); });
$('darkModeToggle').addEventListener('change', e => setDark(e.target.checked));$('fontSizeSlider').addEventListener('input', e => { document.documentElement.style.setProperty('--editor-fs', e.target.value + 'px'); });
['auth-email', 'auth-password'].forEach(i => { $(i).addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); }); });
</script>
